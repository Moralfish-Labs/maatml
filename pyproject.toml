[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maatml"
version = "0.14.0"
description = "Where a small task-specific model is built, weighed, and packaged: one validator-gated lifecycle from data to export for text, vision, and vision-language models"
readme = "README.md"
keywords = [
  "fine-tuning", "llm", "vlm", "lora", "qlora", "peft",
  "small-language-models", "apple-silicon", "mps", "onnx", "vllm",
  "mlops", "machine-learning", "pytorch", "transformers", "cli",
  "edge-ai", "synthetic-data", "structured-output", "validator",
]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Nedal Elghamry" }
]
urls = { Homepage = "https://maatml.pages.dev", Documentation = "https://maatml.pages.dev", Repository = "https://github.com/Moralfish-Labs/maatml", Changelog = "https://github.com/Moralfish-Labs/maatml/blob/main/CHANGELOG.md" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  # Core imports no jsonschema itself, but it is the validator contract every
  # shipped validator is written against (`dataset.schema` is a JSON Schema
  # document, and all examples call jsonschema.validate). Keeping it core
  # means a plugin author can write the documented validator without a second
  # install step. See docs/plugins.md.
  "jsonschema>=4.0",
]

[project.scripts]
# Console-script entry point so `maatml <cmd>` works from any shell after
# `pip install maatml`.  Equivalent to `python -m maatml.cli <cmd>`.
maatml = "maatml.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  # Upper bound so the lint gate is reproducible: ruff 0.16 turned on new
  # default rules (UP045 Optional -> |, B008 which misreads typer's Option
  # defaults, and others) that flag ~490 pre-existing sites across the repo.
  # Adopting it needs config decisions, tracked separately; without the bound
  # CI lints against whatever ruff released today.
  "ruff>=0.5,<0.16",
  # Bounded like ruff above: a major bump changes what the gate reports, and
  # CI installs whatever resolves on the day. mypy 2.x passes today.
  "mypy>=1.10,<3",
  "types-PyYAML>=6.0",
]
ml = [
  # Security floor, not a feature floor: torch < 2.6 carries GHSA-53q9-r3pm-6pq6,
  # a critical RCE in `torch.load` *despite* weights_only=True, which is exactly
  # the call the SFT tokenized cache relies on (training/sft_base.py). Advisories
  # above 2.6 are LOW/MODERATE (memory corruption, local DoS) and not reachable
  # from maatml's own inputs, so the floor stops here rather than at the latest
  # fix: JetPack pins torch to NVIDIA's builds and a higher floor would put
  # maatml out of reach on Jetson.
  "torch>=2.6",
  # transformers < 5.5 carries advisories on the from_pretrained path every
  # trainer and predictor calls.
  "transformers>=5.5",
  "datasets>=2.19",
  "tokenizers>=0.19",
  "safetensors>=0.4",
  "accelerate>=0.30",
  "peft>=0.10",
  "sentencepiece>=0.2.1"
]
cuda = [
  # QLoRA / bitsandbytes: CUDA Linux only (not macOS / MPS). Also install [ml].
  "bitsandbytes>=0.43",
]
pref = [
  # DPO / ORPO via TRL. Also install [ml].
  "trl>=0.9",
]
teacher = [
  # OpenAI-compatible teacher client for maatml datagen --teacher.
  "httpx>=0.27",
]
docs = [
  # Optional docs site: mkdocs serve
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
vision = [
  # Multitask vision (classification / detection / pose) + ONNX export.
  # Also install [ml].
  "torchvision>=0.18",
  # pillow and onnx floors are security floors: the previous ones admitted
  # 35 and 18 known advisories respectively.
  "pillow>=12.3",
  "onnx>=1.22",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.18",
]
vllm = [
  # OpenAI-compatible VLM serving for examples/vision-vlm.
  # Linux-only (use the nvidia-ai-iot container on Jetson).
  "vllm>=0.10; platform_system=='Linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: ship the marker so `mypy` in a downstream project reads maatml's
# annotations instead of treating the package as untyped.
maatml = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.mypy]
# There was no [tool.mypy] at all, so the gate ran on defaults: untyped
# function bodies went unchecked and inert `type: ignore` comments accumulated.
# Every setting below passes today, verified both with and without the ML stack
# installed (mypy --python-executable against a torch/transformers venv).
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Deferred, with reasons:
#   disallow_untyped_defs  43 errors; worth its own annotation pass
#   warn_unreachable        2 errors, both false: they are isinstance guards
#                           over YAML-sourced values that mypy believes are
#                           already the declared type. Removing them would
#                           delete real runtime protection.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit selection: without one, only ruff's ~4-rule default set runs, so
# the lint gate went green while catching almost nothing and 118 of the repo's
# 132 `noqa` directives suppressed rules that were never enabled.
#
# BLE is here specifically to make the 48 `# noqa: BLE001` directives mean
# something: broad excepts in this codebase are deliberate and annotated, and
# now that is enforced rather than asserted. E402 likewise covers the scripts'
# sys.path preamble.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "BLE",  # blind except
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # return consistency
  "PIE",  # misc lints
  "ISC",  # implicit string concat
  "RSE",  # raise
  "ERA",  # commented-out code
  "T20",  # print / pprint
]
ignore = [
  # typer declares CLI options as `x: T = typer.Option(...)` defaults, which is
  # the documented API. This is the rule that forced the ruff<0.16 ceiling.
  "B008",
]

# Families deliberately left out for now, each because adopting it today would
# mean churn or bad changes rather than better code:
#   UP   (466) large mechanical rewrite, worth its own pass
#   S   (1017) bandit; mostly false positives for a local developer CLI
#   PL   (640) opinionated complexity thresholds this codebase has not agreed
#   COM  (441) the formatter already owns comma placement
#   ARG  (134) plugin contracts require unused parameters by design
#   TID  (138) relative imports are the house style
#   N    naming: N815/N818 would rename identifiers that mirror JSON schema
#        fields and public exception names
#   PTH  `open()` is idiomatic here and the codebase already uses Path widely

[tool.ruff.lint.per-file-ignores]
# Scripts and example builders are console programs: printing is their output.
"scripts/*" = ["T201"]
"examples/*/scripts/*" = ["T201"]
[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
