site_name: MaatML
site_description: Experimentation → production for small text, vision, and vision-language models
site_url: https://maatml.pages.dev/
repo_url: https://github.com/Moralfish-Labs/maatml
repo_name: Moralfish-Labs/maatml
extra:
  release_version: "0.14.0"
edit_uri: edit/main/docs/
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
plugins:
  - search
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
nav:
  - Home: index.md
  - Get started: getting-started.md
  - The validator-gated lifecycle: lifecycle.md
  - The data flywheel: flywheel.md
  - Evidence: evidence.md
  - Orchestration & recovery: orchestration.md
  - Rollouts: rollouts.md
  - Serving & deployment: serving.md
  - Plugin author guide: plugins.md
  - Reference:
      - CLI commands: cli.md
      - model.yml: skill/references/model-yml.md
      - Plugin contracts: skill/references/plugins.md
      - Data collection: skill/references/flywheel.md
      - Agent skill: skill/SKILL.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Examples:
      - examples/index.md
      - Support Ticket Triage: examples/support-ticket-triage.md
      - Vision (multitask): examples/vision.md
      - Vision VLM: examples/vision-vlm.md
      - Vision Describer: examples/vision-describer.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
